name: GitStats profile cards
description: Generate GitStats SVG cards and keep them up to date in your GitHub profile README.
author: adityapandeydev
branding:
  icon: bar-chart-2
  color: blue

inputs:
  config:
    description: Layout and card settings exported by GitStats Studio (JSON).
    required: true
  token:
    description: Personal access token used to read your profile, for example secrets.GH_TOKEN. Needed to include private contributions. When empty, the workflow token is used and cards show public data.
    required: false
    default: ''
  github-token:
    description: Fallback token. Leave as the default.
    required: false
    default: ${{ github.token }}
  readme:
    description: README file to update between the gitstats markers.
    required: false
    default: README.md
  output-dir:
    description: Folder for the generated SVG files.
    required: false
    default: gitstats
  commit:
    description: Commit and push the updated cards and README.
    required: false
    default: 'true'

runs:
  using: composite
  steps:
    - uses: mlugg/setup-zig@v2
      with:
        version: '0.16.0'
    - name: Build the GitStats engine
      shell: bash
      working-directory: ${{ github.action_path }}
      run: zig build -Doptimize=ReleaseFast
    - name: Render cards and update README
      shell: bash
      env:
        INPUT_CONFIG: ${{ inputs.config }}
        INPUT_TOKEN: ${{ inputs.token }}
        INPUT_FALLBACK_TOKEN: ${{ inputs.github-token }}
        INPUT_README: ${{ inputs.readme }}
        INPUT_OUTPUT_DIR: ${{ inputs.output-dir }}
        INPUT_COMMIT: ${{ inputs.commit }}
      run: node "$GITHUB_ACTION_PATH/action/run.mjs"
