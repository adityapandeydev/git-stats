name: Generate GitHub Profile Stats

on:
  push:
    branches:
      - main
      - master
    paths:
      - '.github/workflows/generate-stats.yml'
  schedule:
    # Runs every 4 hours (6 times a day) to automatically aggregate private repo commits and streak
    - cron: '0 */4 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-stats:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Zig
        uses: mlugg/setup-zig@v2
        with:
          version: "0.16.0"

      - name: Build and Generate Profile Stats SVG Cards
        env:
          # Uses GH_TOKEN repository secret if provided
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          # 1. Build release binary
          zig build -Doptimize=ReleaseFast

          # 2. Generate Languages Card
          ./zig-out/bin/git_stats --generate \
            --username="${{ github.repository_owner }}" \
            --langs-count=12 \
            --theme="tokyonight" \
            --layout="standard" \
            --columns=2 \
            --card-width=400 \
            --card-height=364 \
            --border-radius=4.5 \
            --hide="jupyter notebook,qml,javascript,html,css,tex" \
            --output="generated/languages.svg"

          # 3. Generate Streak Card (with 14-day momentum sparkline)
          ./zig-out/bin/git_stats --streak \
            --username="${{ github.repository_owner }}" \
            --theme="tokyonight" \
            --card-width=424 \
            --card-height=180 \
            --border-radius=4.5 \
            --output="generated/streak.svg"

          # 4. Generate Developer Stats Card (Rating Ring + 2x2 Matrix)
          ./zig-out/bin/git_stats --stats \
            --username="${{ github.repository_owner }}" \
            --theme="tokyonight" \
            --timeframe="all-time" \
            --card-width=424 \
            --card-height=180 \
            --border-radius=4.5 \
            --output="generated/stats.svg"

          # 5. Generate Commit Rhythm Card (24h x 7d Matrix)
          ./zig-out/bin/git_stats --rhythm \
            --username="${{ github.repository_owner }}" \
            --theme="tokyonight" \
            --tz=5.5 \
            --card-width=424 \
            --card-height=180 \
            --border-radius=4.5 \
            --output="generated/rhythm.svg"

          # 6. Generate Developer DNA Radar Card (5-Axis Polyglot Radar)
          ./zig-out/bin/git_stats --radar \
            --username="${{ github.repository_owner }}" \
            --theme="tokyonight" \
            --card-width=424 \
            --card-height=180 \
            --border-radius=4.5 \
            --output="generated/radar.svg"

          # 7. Generate PR Velocity & Shipping Impact Card
          ./zig-out/bin/git_stats --velocity \
            --username="${{ github.repository_owner }}" \
            --theme="tokyonight" \
            --card-width=424 \
            --card-height=180 \
            --border-radius=4.5 \
            --output="generated/velocity.svg"


      - name: Commit and Push Updated Cards
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add -f generated/*.svg
          git diff --staged --quiet || (git commit -m "chore(stats): update profile statistics cards [skip ci]" && git push)
