name: Project checks

on:
  push:
    branches: [main, master]
    paths:
      - 'src/**'
      - 'frontend/**'
      - 'build.zig'
      - 'build.zig.zon'
      - '.github/workflows/checks.yml'
  pull_request:
    paths:
      - 'src/**'
      - 'frontend/**'
      - 'build.zig'
      - 'build.zig.zon'
      - '.github/workflows/checks.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: mlugg/setup-zig@v2
        with:
          version: '0.16.0'
      - name: Build and test native engine
        run: |
          zig build -Doptimize=ReleaseFast
          zig build test
      - name: Install Studio dependencies
        working-directory: frontend
        run: npm ci
      - name: Lint, build and test Studio
        working-directory: frontend
        run: |
          npm run lint
          npm run build
          npm test
          npm run test:parity
