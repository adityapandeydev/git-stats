<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 424 180" width="424" height="180">
  <defs>
    <linearGradient id="radar-divider-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1a1b27" stop-opacity="0.0"/>
      <stop offset="50%" stop-color="#3b4261" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#1a1b27" stop-opacity="0.0"/>
    </linearGradient>
    <linearGradient id="radar-poly-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#70a5fd" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#7aa2f7" stop-opacity="0.2"/>
    </linearGradient>
    <filter id="radar-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <style>
    .radar-title { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 700; font-size: 11px; letter-spacing: 0.5px; fill: #70a5fd; }
    .radar-sub { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 500; font-size: 7.5px; letter-spacing: 0.35px; fill: #787c99; }
    .radar-axis-lbl { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 700; font-size: 8px; }
    .radar-archetype-txt { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 800; font-size: 10px; letter-spacing: 0.5px; fill: #c0caf5; }
    .radar-domain-lbl { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 600; font-size: 8px; fill: #7982a9; }
    .radar-domain-val { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 700; font-size: 8px; fill: #c0caf5; }
    .radar-footnote { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 500; font-size: 8px; fill: #565f89; }
  </style>
  <rect width="424" height="180" rx="4.5" fill="#1a1b27" stroke="#24283b" stroke-width="1"/>
  <!-- Header -->
  <text x="14" y="24.0" class="radar-title">DEVELOPER DNA</text>
  <circle cx="125" cy="20.5" r="1.8" fill="#70a5fd"/>
  <text x="135" y="23.5" class="radar-sub">5-AXIS POLYGLOT RADAR</text>
  <polygon points="120.0,91.0 132.4,100.0 127.6,114.5 112.4,114.5 107.6,100.0" fill="none" stroke="#24283b" stroke-width="0.8"/>
  <polygon points="120.0,78.0 144.7,96.0 135.3,125.0 104.7,125.0 95.3,96.0" fill="rgba(31, 35, 53, 0.15)" stroke="#24283b" stroke-width="0.8"/>
  <polygon points="120.0,65.0 157.1,91.9 142.9,135.6 97.1,135.6 82.9,91.9" fill="none" stroke="#24283b" stroke-width="0.8"/>
  <polygon points="120.0,52.0 169.5,87.9 150.6,146.1 89.4,146.1 70.5,87.9" fill="rgba(31, 35, 53, 0.25)" stroke="#2e3c64" stroke-width="0.8"/>
  <line x1="120.0" y1="104.0" x2="120.0" y2="52.0" stroke="#2e3c64" stroke-width="0.8" stroke-dasharray="2,2"/>
  <line x1="120.0" y1="104.0" x2="169.5" y2="87.9" stroke="#2e3c64" stroke-width="0.8" stroke-dasharray="2,2"/>
  <line x1="120.0" y1="104.0" x2="150.6" y2="146.1" stroke="#2e3c64" stroke-width="0.8" stroke-dasharray="2,2"/>
  <line x1="120.0" y1="104.0" x2="89.4" y2="146.1" stroke="#2e3c64" stroke-width="0.8" stroke-dasharray="2,2"/>
  <line x1="120.0" y1="104.0" x2="70.5" y2="87.9" stroke="#2e3c64" stroke-width="0.8" stroke-dasharray="2,2"/>
  <!-- Data Polygon -->
  <polygon points="120.0,90.7 136.3,98.7 132.6,121.3 115.8,109.8 102.9,98.4" fill="url(#radar-poly-grad)" stroke="#70a5fd" stroke-width="1.8" filter="url(#radar-glow)"/>
  <circle cx="120.0" cy="90.7" r="2.8" fill="#70a5fd" stroke="#1a1b27" stroke-width="1"/>
  <circle cx="136.3" cy="98.7" r="2.8" fill="#70a5fd" stroke="#1a1b27" stroke-width="1"/>
  <circle cx="132.6" cy="121.3" r="2.8" fill="#70a5fd" stroke="#1a1b27" stroke-width="1"/>
  <circle cx="115.8" cy="109.8" r="2.8" fill="#70a5fd" stroke="#1a1b27" stroke-width="1"/>
  <circle cx="102.9" cy="98.4" r="2.8" fill="#70a5fd" stroke="#1a1b27" stroke-width="1"/>
  <!-- Spoke Labels -->
  <text x="120.0" y="43.0" class="radar-axis-lbl" text-anchor="middle" fill="#ec915c">Systems</text>
  <text x="175.5" y="89.9" class="radar-axis-lbl" text-anchor="start" fill="#70a5fd">Backend</text>
  <text x="154.6" y="158.1" class="radar-axis-lbl" text-anchor="start" fill="#7aa2f7">Frontend</text>
  <text x="85.4" y="158.1" class="radar-axis-lbl" text-anchor="end" fill="#bb9af7">DevOps</text>
  <text x="64.5" y="89.9" class="radar-axis-lbl" text-anchor="end" fill="#73daca">Data &amp; AI</text>
  <!-- Glass Divider -->
  <line x1="246.0" y1="22" x2="246.0" y2="158.0" stroke="url(#radar-divider-grad)" stroke-width="1"/>
  <!-- Right Column: DNA Breakdown -->
  <g transform="translate(254, 0)">
    <!-- Archetype Badge Pill -->
    <g transform="translate(75, 34)">
      <rect x="-70" y="-12" width="140" height="24" rx="12" fill="#1f2335" stroke="#70a5fd" stroke-opacity="0.45" stroke-width="1"/>
      <text x="0" y="4" text-anchor="middle" class="radar-archetype-txt">🧬 Polyglot Architect</text>
    </g>
    <text x="4" y="56.0" class="radar-domain-lbl">Systems</text>
    <text x="146" y="56.0" class="radar-domain-val" text-anchor="end">15%</text>
    <rect x="4" y="60.0" width="142.0" height="3.5" rx="1.75" fill="#24283b"/>
    <rect x="4" y="60.0" width="21.8" height="3.5" rx="1.75" fill="#ec915c"/>
    <text x="4" y="74.0" class="radar-domain-lbl">Backend</text>
    <text x="146" y="74.0" class="radar-domain-val" text-anchor="end">24%</text>
    <rect x="4" y="78.0" width="142.0" height="3.5" rx="1.75" fill="#24283b"/>
    <rect x="4" y="78.0" width="33.9" height="3.5" rx="1.75" fill="#70a5fd"/>
    <text x="4" y="92.0" class="radar-domain-lbl">Frontend</text>
    <text x="146" y="92.0" class="radar-domain-val" text-anchor="end">33%</text>
    <rect x="4" y="96.0" width="142.0" height="3.5" rx="1.75" fill="#24283b"/>
    <rect x="4" y="96.0" width="47.2" height="3.5" rx="1.75" fill="#7aa2f7"/>
    <text x="4" y="110.0" class="radar-domain-lbl">DevOps</text>
    <text x="146" y="110.0" class="radar-domain-val" text-anchor="end">2%</text>
    <rect x="4" y="114.0" width="142.0" height="3.5" rx="1.75" fill="#24283b"/>
    <rect x="4" y="114.0" width="3.5" height="3.5" rx="1.75" fill="#bb9af7"/>
    <text x="4" y="128.0" class="radar-domain-lbl">Data &amp; AI</text>
    <text x="146" y="128.0" class="radar-domain-val" text-anchor="end">26%</text>
    <rect x="4" y="132.0" width="142.0" height="3.5" rx="1.75" fill="#24283b"/>
    <rect x="4" y="132.0" width="36.4" height="3.5" rx="1.75" fill="#73daca"/>
    <!-- Analyzed Languages Footnote -->
    <text x="75" y="156" text-anchor="middle" class="radar-footnote">29 Languages Mapped</text>
  </g>
</svg>
