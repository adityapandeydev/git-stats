<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 424 180" width="424" height="180">
  <defs>
    <linearGradient id="mil-glass-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#24283b" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#1f2335" stop-opacity="0.3"/>
    </linearGradient>
  </defs>
  <style>
    .mil-title { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 700; font-size: 11px; letter-spacing: 0.6px; fill: #70a5fd; }
    .mil-sub { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 500; font-size: 7.5px; letter-spacing: 0.35px; fill: #787c99; }
    .mil-badge-txt { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 800; font-size: 9px; letter-spacing: 0.4px; fill: #70a5fd; }
    .mil-lbl { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 700; font-size: 7.2px; letter-spacing: 0.35px; fill: #7aa2f7; }
    .mil-val { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 800; font-size: 11.5px; fill: #c0caf5; }
    .mil-tier-txt { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 800; font-size: 6.5px; letter-spacing: 0.5px; }
    .mil-target-txt { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 500; font-size: 6.8px; fill: #787c99; }
    @keyframes milFadeIn {
      from { opacity: 0; transform: translateY(4px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .mil-anim { animation: milFadeIn 0.5s ease-out forwards; }
  </style>

  <rect width="424" height="180" rx="4.5" fill="#1a1b27" stroke="#24283b" stroke-width="1"/>
  <!-- Header -->
  <text x="18" y="24.0" class="mil-title">CAREER MILESTONES</text>
  <circle cx="145" cy="20.5" r="1.8" fill="#70a5fd"/>
  <text x="153" y="23.5" class="mil-sub">ACHIEVEMENTS &amp; TROPHIES</text>
  <rect x="264.0" y="12.0" width="142.0" height="18.0" rx="3.5" fill="#70a5fd" fill-opacity="0.12" stroke="#70a5fd" stroke-opacity="0.45" stroke-width="0.8"/>
  <text x="335.0" y="24.0" text-anchor="middle" class="mil-badge-txt">💎 Diamond Architect</text>
  <!-- Milestone Tile 1: STREAK RUNNER -->
  <g class="mil-anim" style="animation-delay: 0ms;">
    <rect x="18.0" y="38.0" width="123.0" height="58.0" rx="4.5" fill="#1f2335" fill-opacity="0.45" stroke="#bb9af7" stroke-opacity="0.30" stroke-width="0.8"/>
    <!-- Top Heading Row (Full Width) -->
    <text x="27.5" y="51.5" class="mil-lbl">STREAK RUNNER</text>
    <text x="131.5" y="51.5" text-anchor="end" class="mil-target-txt">Max Tier</text>
    <!-- Bottom Section: Logo + Aligned Text -->
    <circle cx="37.5" cy="74.5" r="11.5" fill="#bb9af7" fill-opacity="0.12" stroke="#bb9af7" stroke-opacity="0.40" stroke-width="0.8"/>
    <text x="37.5" y="78.5" text-anchor="middle" font-size="11.5px">🔥</text>
    <text x="55.0" y="71.0" class="mil-val">664 Days</text>
    <!-- Tier Pill -->
    <rect x="55.0" y="77.0" width="44.0" height="11.5" rx="2.5" fill="#bb9af7" fill-opacity="0.14" stroke="#bb9af7" stroke-opacity="0.45" stroke-width="0.6"/>
    <text x="77.0" y="85.2" text-anchor="middle" class="mil-tier-txt" fill="#bb9af7">DIAMOND</text>
  </g>
  <!-- Milestone Tile 2: POLYGLOT -->
  <g class="mil-anim" style="animation-delay: 45ms;">
    <rect x="150.5" y="38.0" width="123.0" height="58.0" rx="4.5" fill="#1f2335" fill-opacity="0.45" stroke="#bb9af7" stroke-opacity="0.30" stroke-width="0.8"/>
    <!-- Top Heading Row (Full Width) -->
    <text x="160.0" y="51.5" class="mil-lbl">POLYGLOT</text>
    <text x="264.0" y="51.5" text-anchor="end" class="mil-target-txt">Max Tier</text>
    <!-- Bottom Section: Logo + Aligned Text -->
    <circle cx="170.0" cy="74.5" r="11.5" fill="#bb9af7" fill-opacity="0.12" stroke="#bb9af7" stroke-opacity="0.40" stroke-width="0.8"/>
    <text x="170.0" y="78.5" text-anchor="middle" font-size="11.5px">🌐</text>
    <text x="187.5" y="71.0" class="mil-val">28 Stacks</text>
    <!-- Tier Pill -->
    <rect x="187.5" y="77.0" width="44.0" height="11.5" rx="2.5" fill="#bb9af7" fill-opacity="0.14" stroke="#bb9af7" stroke-opacity="0.45" stroke-width="0.6"/>
    <text x="209.5" y="85.2" text-anchor="middle" class="mil-tier-txt" fill="#bb9af7">DIAMOND</text>
  </g>
  <!-- Milestone Tile 3: CODE TITAN -->
  <g class="mil-anim" style="animation-delay: 90ms;">
    <rect x="283.0" y="38.0" width="123.0" height="58.0" rx="4.5" fill="#1f2335" fill-opacity="0.45" stroke="#70a5fd" stroke-opacity="0.30" stroke-width="0.8"/>
    <!-- Top Heading Row (Full Width) -->
    <text x="292.5" y="51.5" class="mil-lbl">CODE TITAN</text>
    <text x="396.5" y="51.5" text-anchor="end" class="mil-target-txt">Next: 5k</text>
    <!-- Bottom Section: Logo + Aligned Text -->
    <circle cx="302.5" cy="74.5" r="11.5" fill="#70a5fd" fill-opacity="0.12" stroke="#70a5fd" stroke-opacity="0.40" stroke-width="0.8"/>
    <text x="302.5" y="78.5" text-anchor="middle" font-size="11.5px">⚡</text>
    <text x="320.0" y="71.0" class="mil-val">2.1k Contribs</text>
    <!-- Tier Pill -->
    <rect x="320.0" y="77.0" width="44.0" height="11.5" rx="2.5" fill="#70a5fd" fill-opacity="0.14" stroke="#70a5fd" stroke-opacity="0.45" stroke-width="0.6"/>
    <text x="342.0" y="85.2" text-anchor="middle" class="mil-tier-txt" fill="#70a5fd">PLATINUM</text>
  </g>
  <!-- Milestone Tile 4: PR SPECIALIST -->
  <g class="mil-anim" style="animation-delay: 135ms;">
    <rect x="18.0" y="105.0" width="123.0" height="58.0" rx="4.5" fill="#1f2335" fill-opacity="0.45" stroke="#e0af68" stroke-opacity="0.30" stroke-width="0.8"/>
    <!-- Top Heading Row (Full Width) -->
    <text x="27.5" y="118.5" class="mil-lbl">PR SPECIALIST</text>
    <text x="131.5" y="118.5" text-anchor="end" class="mil-target-txt">Next: 20</text>
    <!-- Bottom Section: Logo + Aligned Text -->
    <circle cx="37.5" cy="141.5" r="11.5" fill="#e0af68" fill-opacity="0.12" stroke="#e0af68" stroke-opacity="0.40" stroke-width="0.8"/>
    <text x="37.5" y="145.5" text-anchor="middle" font-size="11.5px">🔀</text>
    <text x="55.0" y="138.0" class="mil-val">15 Merged</text>
    <!-- Tier Pill -->
    <rect x="55.0" y="144.0" width="44.0" height="11.5" rx="2.5" fill="#e0af68" fill-opacity="0.14" stroke="#e0af68" stroke-opacity="0.45" stroke-width="0.6"/>
    <text x="77.0" y="152.2" text-anchor="middle" class="mil-tier-txt" fill="#e0af68">GOLD</text>
  </g>
  <!-- Milestone Tile 5: REPO MASTER -->
  <g class="mil-anim" style="animation-delay: 180ms;">
    <rect x="150.5" y="105.0" width="123.0" height="58.0" rx="4.5" fill="#1f2335" fill-opacity="0.45" stroke="#bb9af7" stroke-opacity="0.30" stroke-width="0.8"/>
    <!-- Top Heading Row (Full Width) -->
    <text x="160.0" y="118.5" class="mil-lbl">REPO MASTER</text>
    <text x="264.0" y="118.5" text-anchor="end" class="mil-target-txt">Max Tier</text>
    <!-- Bottom Section: Logo + Aligned Text -->
    <circle cx="170.0" cy="141.5" r="11.5" fill="#bb9af7" fill-opacity="0.12" stroke="#bb9af7" stroke-opacity="0.40" stroke-width="0.8"/>
    <text x="170.0" y="145.5" text-anchor="middle" font-size="11.5px">📦</text>
    <text x="187.5" y="138.0" class="mil-val">39 Repos</text>
    <!-- Tier Pill -->
    <rect x="187.5" y="144.0" width="44.0" height="11.5" rx="2.5" fill="#bb9af7" fill-opacity="0.14" stroke="#bb9af7" stroke-opacity="0.45" stroke-width="0.6"/>
    <text x="209.5" y="152.2" text-anchor="middle" class="mil-tier-txt" fill="#bb9af7">DIAMOND</text>
  </g>
  <!-- Milestone Tile 6: STAR MAGNET -->
  <g class="mil-anim" style="animation-delay: 225ms;">
    <rect x="283.0" y="105.0" width="123.0" height="58.0" rx="4.5" fill="#1f2335" fill-opacity="0.45" stroke="#ff9e64" stroke-opacity="0.30" stroke-width="0.8"/>
    <!-- Top Heading Row (Full Width) -->
    <text x="292.5" y="118.5" class="mil-lbl">STAR MAGNET</text>
    <text x="396.5" y="118.5" text-anchor="end" class="mil-target-txt">Next: 5</text>
    <!-- Bottom Section: Logo + Aligned Text -->
    <circle cx="302.5" cy="141.5" r="11.5" fill="#ff9e64" fill-opacity="0.12" stroke="#ff9e64" stroke-opacity="0.40" stroke-width="0.8"/>
    <text x="302.5" y="145.5" text-anchor="middle" font-size="11.5px">⭐</text>
    <text x="320.0" y="138.0" class="mil-val">1 Star</text>
    <!-- Tier Pill -->
    <rect x="320.0" y="144.0" width="44.0" height="11.5" rx="2.5" fill="#ff9e64" fill-opacity="0.14" stroke="#ff9e64" stroke-opacity="0.45" stroke-width="0.6"/>
    <text x="342.0" y="152.2" text-anchor="middle" class="mil-tier-txt" fill="#ff9e64">BRONZE</text>
  </g>
</svg>