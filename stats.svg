<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 424 180" width="424" height="180">
  <defs>
    <filter id="ring-glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="4" result="blur1"/>
      <feGaussianBlur in="SourceGraphic" stdDeviation="10" result="blur2"/>
      <feMerge>
        <feMergeNode in="blur2"/>
        <feMergeNode in="blur1"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <linearGradient id="tier-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#bb9af7"/>
      <stop offset="100%" stop-color="#7aa2f7"/>
    </linearGradient>
    <linearGradient id="stats-divider-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1a1b27" stop-opacity="0.0"/>
      <stop offset="50%" stop-color="#3b4261" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#1a1b27" stop-opacity="0.0"/>
    </linearGradient>
    <radialGradient id="ring-aura" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#bb9af7" stop-opacity="0.28"/>
      <stop offset="65%" stop-color="#7aa2f7" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#7aa2f7" stop-opacity="0.0"/>
    </radialGradient>
  </defs>
  <style>
    @keyframes ringFlow {
      from { stroke-dashoffset: 263.9; }
      to { stroke-dashoffset: 54.7; }
    }
    @keyframes auraBreathe {
      0%, 100% { transform: scale(1.0); opacity: 0.8; }
      50% { transform: scale(1.12); opacity: 1.0; }
    }
    .stat-heading { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 700; }
    .matrix-val { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 800; }
    .matrix-lbl { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 600; }
    .matrix-sub { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 500; }
    .tier-badge-txt { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 900; }
    .tier-sub-txt { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 700; }
  </style>
  <rect width="424" height="180" rx="4.5" fill="#1a1b27" stroke="#24283b" stroke-width="1"/>
  <!-- Header -->
  <text x="24" y="25.0" class="stat-heading" font-size="12.5" letter-spacing="1.2" fill="#70a5fd">DEVELOPER STATS</text>
  <circle cx="180" cy="21.5" r="2.5" fill="#bb9af7"/>
  <text x="188" y="24.5" class="matrix-sub" font-size="9" letter-spacing="0.5" fill="#787c99">ALL-TIME</text>
  <!-- Tile 1: Commits -->
  <g transform="translate(24.0, 38.0)">
    <rect width="104.0" height="56.0" rx="6" fill="#1f2335" fill-opacity="0.45" stroke="#292e42" stroke-width="0.8"/>
    <!-- Commit Node Icon -->
    <circle cx="15" cy="18" r="4.5" fill="none" stroke="#70a5fd" stroke-width="1.8"/>
    <circle cx="15" cy="18" r="2" fill="#70a5fd"/>
    <text x="15" y="38.0" class="matrix-val" font-size="16.5" fill="#c0caf5">1,955</text>
    <text x="15" y="50.0" class="matrix-lbl" font-size="9" letter-spacing="0.6" fill="#7aa2f7">COMMITS</text>
  </g>
  <!-- Tile 2: Merged PRs -->
  <g transform="translate(136.0, 38.0)">
    <rect width="104.0" height="56.0" rx="6" fill="#1f2335" fill-opacity="0.45" stroke="#292e42" stroke-width="0.8"/>
    <!-- PR Icon -->
    <path d="M 12 12 L 12 24 M 18 12 L 18 17 C 18 20 12 20 12 20" fill="none" stroke="#7aa2f7" stroke-width="1.6" stroke-linecap="round"/>
    <circle cx="12" cy="12" r="2.2" fill="#7aa2f7"/>
    <circle cx="18" cy="12" r="2.2" fill="#7aa2f7"/>
    <circle cx="12" cy="24" r="2.2" fill="#7aa2f7"/>
    <text x="15" y="38.0" class="matrix-val" font-size="16.5" fill="#c0caf5">15</text>
    <text x="15" y="50.0" class="matrix-lbl" font-size="9" letter-spacing="0.6" fill="#bb9af7">MERGED PRS</text>
  </g>
  <!-- Tile 3: Stars Earned -->
  <g transform="translate(24.0, 102.0)">
    <rect width="104.0" height="56.0" rx="6" fill="#1f2335" fill-opacity="0.45" stroke="#292e42" stroke-width="0.8"/>
    <!-- Star Icon -->
    <path d="M 15 11 L 16.5 14.5 L 20 14.8 L 17.4 17.2 L 18.2 21 L 15 19.1 L 11.8 21 L 12.6 17.2 L 10 14.8 L 13.5 14.5 Z" fill="#e0af68"/>
    <text x="15" y="38.0" class="matrix-val" font-size="16.5" fill="#c0caf5">1</text>
    <text x="15" y="50.0" class="matrix-lbl" font-size="9" letter-spacing="0.6" fill="#e0af68">TOTAL STARS</text>
  </g>
  <!-- Tile 4: Repositories -->
  <g transform="translate(136.0, 102.0)">
    <rect width="104.0" height="56.0" rx="6" fill="#1f2335" fill-opacity="0.45" stroke="#292e42" stroke-width="0.8"/>
    <!-- Repo Book Icon -->
    <path d="M 11 12 C 13 11 16 11 16 13 L 16 23 C 16 21 13 21 11 22 Z M 21 12 C 19 11 16 11 16 13 L 16 23 C 16 21 19 21 21 22 Z" fill="none" stroke="#73daca" stroke-width="1.5" stroke-linejoin="round"/>
    <text x="15" y="38.0" class="matrix-val" font-size="16.5" fill="#c0caf5">39</text>
    <text x="15" y="50.0" class="matrix-lbl" font-size="9" letter-spacing="0.6" fill="#73daca">REPOSITORIES</text>
  </g>
  <!-- Glass Divider -->
  <line x1="254.0" y1="22" x2="254.0" y2="158.0" stroke="url(#stats-divider-grad)" stroke-width="1"/>
  <!-- Radial Rating Gauge -->
  <g transform="translate(335.0, 75.0)">
    <!-- Aura Glow -->
    <circle cx="0" cy="0" r="54" fill="url(#ring-aura)" style="animation: auraBreathe 4s ease-in-out infinite; transform-origin: 0px 0px;"/>
    <!-- Inactive Track -->
    <circle cx="0" cy="0" r="42.0" fill="none" stroke="#24283b" stroke-width="6.5" stroke-linecap="round"/>
    <!-- Active Gradient Progress Ring -->
    <circle cx="0" cy="0" r="42.0" fill="none" stroke="url(#tier-grad)" stroke-width="6.5" stroke-linecap="round"
      stroke-dasharray="263.9" stroke-dashoffset="54.7" transform="rotate(-90)" style="animation: ringFlow 1.6s cubic-bezier(0.16, 1, 0.3, 1) forwards;"/>
    <!-- Tier Grade Badge Text -->
    <text x="0" y="5" text-anchor="middle" class="tier-badge-txt" font-size="28" fill="url(#tier-grad)" filter="url(#ring-glow)">S</text>
    <!-- Numeric Score -->
    <text x="0" y="22" text-anchor="middle" class="tier-sub-txt" font-size="10.5" fill="#a9b1d6">792 / 1000</text>
  </g>
  <!-- Rank Pill Badge -->
  <g transform="translate(278.0, 138.0)">
    <rect width="114.0" height="19.0" rx="9.5" fill="#bb9af7" fill-opacity="0.16" stroke="url(#tier-grad)" stroke-width="1"/>
    <text x="57.0" y="12.5" text-anchor="middle" class="stat-heading" font-size="8.8" letter-spacing="0.8" fill="#ffffff">Top 2%</text>
  </g>
  <text x="335.0" y="169" text-anchor="middle" class="matrix-sub" font-size="9.5" letter-spacing="0.5" fill="#787c99">Master Craftsman</text>
</svg>
