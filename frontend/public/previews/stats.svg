<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 424 180" width="424" height="180">
  <defs>
    <filter id="ring-glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="4" result="blur1"/>
      <feGaussianBlur in="SourceGraphic" stdDeviation="10" result="blur2"/>
      <feMerge>
        <feMergeNode in="blur2"/>
        <feMergeNode in="blur1"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <linearGradient id="tier-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f7768e"/>
      <stop offset="100%" stop-color="#ff9e64"/>
    </linearGradient>
    <linearGradient id="stats-divider-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1a1b27" stop-opacity="0.0"/>
      <stop offset="50%" stop-color="#3b4261" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#1a1b27" stop-opacity="0.0"/>
    </linearGradient>
    <radialGradient id="ring-aura" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f7768e" stop-opacity="0.28"/>
      <stop offset="65%" stop-color="#ff9e64" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#ff9e64" stop-opacity="0.0"/>
    </radialGradient>
  </defs>
  <style>
    @keyframes ringFlow {
      from { stroke-dashoffset: 263.9; }
      to { stroke-dashoffset: 23.6; }
    }
    @keyframes auraBreathe {
      0%, 100% { transform: scale(1.0); opacity: 0.8; }
      50% { transform: scale(1.12); opacity: 1.0; }
    }
    .stat-heading { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 700; }
    .matrix-val { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 800; font-size: 18.5px; fill: #c0caf5; }
    .matrix-lbl { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 700; font-size: 8.5px; letter-spacing: 0.7px; }
    .matrix-sub { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 500; }
    .tier-badge-txt { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 900; }
    .tier-sub-txt { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 700; }
  </style>
  <rect width="424" height="180" rx="4.5" fill="#1a1b27" stroke="#24283b" stroke-width="1"/>
  <!-- Header -->
  <text x="22" y="25.0" class="stat-heading" font-size="12.5" letter-spacing="1.2" fill="#70a5fd">DEVELOPER STATS</text>
  <circle cx="178" cy="21.5" r="2.5" fill="#f7768e"/>
  <text x="186" y="24.5" class="matrix-sub" font-size="9" letter-spacing="0.5" fill="#787c99">ALL-TIME</text>
  <!-- Tile 1: Commits -->
  <g transform="translate(22.0, 38.0)">
    <rect width="108.0" height="56.0" rx="6" fill="#1f2335" fill-opacity="0.5" stroke="#292e42" stroke-width="0.8"/>
    <text x="13" y="21.0" class="matrix-lbl" fill="#7aa2f7">COMMITS</text>
    <circle cx="92" cy="17.0" r="10" fill="#7aa2f7" fill-opacity="0.12"/>
    <circle cx="92" cy="17.0" r="4.2" fill="none" stroke="#70a5fd" stroke-width="1.6"/>
    <circle cx="92" cy="17.0" r="1.8" fill="#70a5fd"/>
    <text x="13" y="45.5" class="matrix-val">1,450</text>
  </g>
  <!-- Tile 2: Merged PRs -->
  <g transform="translate(138.0, 38.0)">
    <rect width="108.0" height="56.0" rx="6" fill="#1f2335" fill-opacity="0.5" stroke="#292e42" stroke-width="0.8"/>
    <text x="13" y="21.0" class="matrix-lbl" fill="#bb9af7">MERGED PRS</text>
    <circle cx="92" cy="17.0" r="10" fill="#bb9af7" fill-opacity="0.12"/>
    <g transform="translate(92, 17.0)">
      <path d="M -3 -5 L -3 5 M 3 -5 L 3 -1 C 3 2 -3 2 -3 2" fill="none" stroke="#bb9af7" stroke-width="1.4" stroke-linecap="round"/>
      <circle cx="-3" cy="-5" r="1.6" fill="#bb9af7"/>
      <circle cx="3" cy="-5" r="1.6" fill="#bb9af7"/>
      <circle cx="-3" cy="5" r="1.6" fill="#bb9af7"/>
    </g>
    <text x="13" y="45.5" class="matrix-val">24</text>
  </g>
  <!-- Tile 3: Stars Earned -->
  <g transform="translate(22.0, 102.0)">
    <rect width="108.0" height="56.0" rx="6" fill="#1f2335" fill-opacity="0.5" stroke="#292e42" stroke-width="0.8"/>
    <text x="13" y="21.0" class="matrix-lbl" fill="#e0af68">TOTAL STARS</text>
    <circle cx="92" cy="17.0" r="10" fill="#e0af68" fill-opacity="0.12"/>
    <g transform="translate(92, 17.0)">
      <path d="M 0 -5 L 1.3 -1.5 L 5 -1.2 L 2.3 1.2 L 3 5 L 0 3.1 L -3 5 L -2.3 1.2 L -5 -1.2 L -1.3 -1.5 Z" fill="#e0af68"/>
    </g>
    <text x="13" y="45.5" class="matrix-val">65</text>
  </g>
  <!-- Tile 4: Repositories -->
  <g transform="translate(138.0, 102.0)">
    <rect width="108.0" height="56.0" rx="6" fill="#1f2335" fill-opacity="0.5" stroke="#292e42" stroke-width="0.8"/>
    <text x="13" y="21.0" class="matrix-lbl" letter-spacing="0.6" fill="#73daca">REPOSITORIES</text>
    <circle cx="92" cy="17.0" r="10" fill="#73daca" fill-opacity="0.12"/>
    <g transform="translate(92, 17.0)">
      <path d="M -4.5 -4.5 C -2.5 -5.5 0 -5.5 0 -3.5 L 0 4.5 C 0 2.5 -2.5 2.5 -4.5 3.5 Z M 4.5 -4.5 C 2.5 -5.5 0 -5.5 0 -3.5 L 0 4.5 C 0 2.5 2.5 2.5 4.5 3.5 Z" fill="none" stroke="#73daca" stroke-width="1.3" stroke-linejoin="round"/>
    </g>
    <text x="13" y="45.5" class="matrix-val">14</text>
  </g>
  <!-- Glass Divider -->
  <line x1="254.0" y1="22" x2="254.0" y2="158.0" stroke="url(#stats-divider-grad)" stroke-width="1"/>
  <!-- Radial Rating Gauge -->
  <g transform="translate(335.0, 75.0)">
    <!-- Aura Glow -->
    <circle cx="0" cy="0" r="54" fill="url(#ring-aura)" style="animation: auraBreathe 4s ease-in-out infinite; transform-origin: 0px 0px;"/>
    <!-- Inactive Track -->
    <circle cx="0" cy="0" r="42.0" fill="none" stroke="#24283b" stroke-width="6.5" stroke-linecap="round"/>
    <!-- Active Gradient Progress Ring -->
    <circle cx="0" cy="0" r="42.0" fill="none" stroke="url(#tier-grad)" stroke-width="6.5" stroke-linecap="round"
      stroke-dasharray="263.9" stroke-dashoffset="23.6" transform="rotate(-90)" style="animation: ringFlow 1.6s cubic-bezier(0.16, 1, 0.3, 1) forwards;"/>
    <!-- Tier Grade Badge Text -->
    <text x="0" y="5" text-anchor="middle" class="tier-badge-txt" font-size="28" fill="url(#tier-grad)" filter="url(#ring-glow)">S+</text>
    <!-- Numeric Score -->
    <text x="0" y="22" text-anchor="middle" class="tier-sub-txt" font-size="10.5" fill="#a9b1d6">910 / 1000</text>
  </g>
  <!-- Rank Pill Badge -->
  <g transform="translate(278.0, 138.0)">
    <rect width="114.0" height="19.0" rx="9.5" fill="#f7768e" fill-opacity="0.16" stroke="url(#tier-grad)" stroke-width="1"/>
    <text x="57.0" y="12.5" text-anchor="middle" class="stat-heading" font-size="8.8" letter-spacing="0.8" fill="#ffffff">Top 0.5%</text>
  </g>
  <text x="335.0" y="169" text-anchor="middle" class="matrix-sub" font-size="9.5" letter-spacing="0.5" fill="#787c99">Mythic Architect</text>
</svg>
