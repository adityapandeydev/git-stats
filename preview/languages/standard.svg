<svg width="400" height="226" viewBox="0 0 400 226" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Most Used Languages"><style>
        .card-title { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-size: 16px; font-weight: 600; fill: #70a5fd; }
        .lang-name { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-size: 12.5px; font-weight: 500; fill: #c0caf5; }
        .lang-pct { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-size: 12px; font-weight: 400; fill: #7982a9; }
        .bar-bg { fill: #212337; rx: 5px; }
        .bar-segment { transition: all 0.3s ease; }
    
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(4px); }
            to { opacity: 1; transform: translateY(0); }
        }
        @keyframes scaleBar {
            from { transform: scaleX(0); }
            to { transform: scaleX(1); }
        }
        .animate-item { animation: fadeIn 0.4s ease-out forwards; }
        .bar-container { transform-origin: left; animation: scaleBar 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
        </style><rect width="400" height="226" rx="4.5" fill="#1a1b27" stroke="#24283b" stroke-width="1"/><text x="25" y="28" class="card-title">Most Used Languages</text>
