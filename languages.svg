<svg width="495" height="405" viewBox="0 0 495 405" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Most Used Languages"><style>
		.card-bg { fill: #151520; stroke: #2a2a3c; stroke-width: 1px; rx: 10px; }
		.card-title { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-size: 16px; font-weight: 600; fill: #388bfd; }
		.lang-name { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-size: 12.5px; font-weight: 500; fill: #c0caf5; }
		.lang-pct { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-size: 12px; font-weight: 400; fill: #7982a9; }
		.bar-bg { fill: #212337; rx: 5px; }
		.bar-segment { transition: all 0.3s ease; }
	
		@keyframes fadeIn {
			from { opacity: 0; transform: translateY(4px); }
			to { opacity: 1; transform: translateY(0); }
		}
		@keyframes scaleBar {
			from { transform: scaleX(0); }
			to { transform: scaleX(1); }
		}
		.animate-item { animation: fadeIn 0.4s ease-out forwards; }
		.bar-container { transform-origin: left; animation: scaleBar 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
		</style><rect class="card-bg" x="0.5" y="0.5" width="494" height="404" rx="10" fill="#151520" stroke="#2a2a3c"/><text x="25" y="53" class="card-title">Most Used Languages</text>
